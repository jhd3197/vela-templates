<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notebook</title>
<!-- The shared Vela app layout: surfaces, controls and theme tokens that match
     the server's workspace. Copy both files into your own app and keep them in
     step; nothing here talks to the host except through the SDK. -->
<link rel="stylesheet" href="vela-app.css">
<style>
  .notebook { padding: 20px; gap: 12px; }
  .notebook textarea {
    flex: 1; width: 100%; min-height: 45vh; padding: 14px; resize: none;
    border: 1px solid var(--vela-border); border-radius: var(--vela-radius-sm);
    background: var(--vela-field); color: var(--vela-text); font: inherit;
  }
  .notebook-actions { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<main class="vela-surface" id="surface">
  <div class="vela-surface-head">
    <strong style="font-size:15px;font-weight:500">Notebook</strong>
    <span style="flex:1"></span>
    <span class="vela-item-meta" id="status" role="status">Connecting…</span>
  </div>
  <div class="vela-surface-body notebook">
    <label for="note" class="vela-panel-title" style="padding:0">Your notes</label>
    <textarea id="note" disabled></textarea>
    <div class="notebook-actions">
      <button class="vela-btn vela-btn-primary" id="save" disabled>Save</button>
      <button class="vela-btn" id="reload">Discard edits and reload</button>
    </div>
  </div>
</main>
<script src="_vela/sdk.js"></script>
<script src="vela-theme.js"></script>
<script>
const note=document.getElementById('note'),status=document.getElementById('status'),button=document.getElementById('save');let revision=0,busy=false;
async function read(){const saved=await Vela.storage.read();note.value=saved.value?.text||'';revision=saved.revision;note.disabled=false;button.disabled=false;await Vela.setUnsavedChanges(false);status.textContent='Loaded from your server';}
async function save(){if(busy)throw Error('Save in progress');busy=true;button.disabled=true;note.disabled=true;try{const saved=await Vela.storage.write({text:note.value},revision);revision=saved.revision;await Vela.setUnsavedChanges(false);status.textContent='Saved';}catch(error){status.textContent=error.status===409?'Another client saved changes. Your draft is retained; copy it before reloading.':error.message;throw error;}finally{busy=false;button.disabled=false;note.disabled=false;}}
note.oninput=()=>Vela.setUnsavedChanges(true).catch(error=>status.textContent=error.message);
button.onclick=()=>save().catch(()=>{});Vela.onSave(save);
document.getElementById('reload').onclick=()=>read().catch(error=>status.textContent=error.message);
Vela.ready.then(read).catch(error=>status.textContent=error.message);
// Seamless view: leave room for the host's reserved exit control. In hub and
// compact views the host draws its own chrome outside this frame instead.
Vela.onContext(context=>{const rect=context.viewport?.hostControl;document.getElementById('surface').style.paddingTop=rect?Math.max(0,rect.y+rect.height+12)+'px':'0px';});
</script>
</body>
</html>
